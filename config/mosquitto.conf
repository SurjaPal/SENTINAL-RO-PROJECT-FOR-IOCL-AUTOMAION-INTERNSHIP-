# Sentinel-RO dev broker config — anonymous access, local dev only.
# Do not use this config as-is anywhere internet-facing: Phase 11's own FDS
# requires TLS + mutual auth on the real IoT link (see the learning guide,
# Section 1 "Advanced"). This is intentionally the simplest possible
# config so Week 1-2 can focus on the schema and pipeline, not broker auth.

listener 1883
allow_anonymous true
